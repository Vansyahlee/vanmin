name: vanmin

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      PGHOST: host.docker.internal
      PGPORT: "${PGPORT:-5432}"
      PGUSER: "${PGUSER:?Isi PGUSER di .env}"
      PGPASSWORD: "${PGPASSWORD:?Isi PGPASSWORD di .env}"
      PGDATABASE: "${PGDATABASE:?Isi PGDATABASE di .env}"
      PGSSLMODE: "${PGSSLMODE:-disable}"

  frontend:
    profiles:
      - frontend
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_started
